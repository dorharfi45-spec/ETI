<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --surface-1: #f8fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text-primary: #1e293b;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1e293b;
      --border: #334155;
      --border-strong: #475569;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
    }
  }
  html, body { margin:0; padding:0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: var(--text-primary); padding: 10px; box-sizing: border-box; }
  button { cursor:pointer; border:1px solid var(--border-strong); background: var(--surface-1); color: var(--text-primary); border-radius:6px; padding:4px 10px; font-size:12px; }
  button:hover { background: var(--border); }
  svg { touch-action: none; }
</style>
</head>
<body>
<div style="display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap;">
  <svg id="uc" viewBox="0 0 340 400" width="340" height="400" style="flex-shrink:0;">
    <rect x="1" y="1" width="338" height="398" rx="10" fill="var(--surface-1)" stroke="var(--border)"/>
    <line x1="30" y1="200" x2="320" y2="200" stroke="var(--border-strong)" stroke-width="1.6"/>
    <line x1="170" y1="380" x2="170" y2="60" stroke="var(--border-strong)" stroke-width="1.6"/>
    <text x="90" y="90" font-size="11" fill="var(--text-muted)" text-anchor="middle">II</text>
    <text x="250" y="90" font-size="11" fill="var(--text-muted)" text-anchor="middle">I</text>
    <text x="90" y="320" font-size="11" fill="var(--text-muted)" text-anchor="middle">III</text>
    <text x="250" y="320" font-size="11" fill="var(--text-muted)" text-anchor="middle">IV</text>
    <circle cx="170" cy="200" r="120" fill="none" stroke="var(--border-strong)" stroke-width="2"/>
    <line x1="290" y1="20" x2="290" y2="380" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="2,3"/>
    <text x="290" y="14" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">x=1 (tangent line)</text>
    <line id="radiusExt" x1="170" y1="200" x2="170" y2="200" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3,3"/>
    <line id="cosLine" x1="170" y1="200" x2="170" y2="200" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4,3"/>
    <line id="sinLine" x1="170" y1="200" x2="170" y2="200" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="4,3"/>
    <line id="tanSeg" x1="290" y1="200" x2="290" y2="200" stroke="#16a34a" stroke-width="2.8"/>
    <line id="radius" x1="170" y1="200" x2="170" y2="200" stroke="#7c3aed" stroke-width="2.4"/>
    <circle cx="290" cy="200" r="3" fill="var(--text-secondary)"/>
    <text x="296" y="216" font-size="10.5" fill="var(--text-muted)">(1,0)</text>
    <g id="tanPointGroup" style="cursor:grab; touch-action:none;">
      <circle id="tanPointHit" cx="290" cy="200" r="18" fill="transparent"/>
      <circle id="tanPointVisual" cx="290" cy="200" r="9" fill="#16a34a" stroke="var(--surface-1)" stroke-width="2" style="pointer-events:none;"/>
    </g>
    <g id="anglePointGroup" style="cursor:grab; touch-action:none;">
      <circle id="anglePointHit" cx="290" cy="200" r="18" fill="transparent"/>
      <circle id="anglePointVisual" cx="290" cy="200" r="9" fill="#7c3aed" stroke="var(--surface-1)" stroke-width="2" style="pointer-events:none;"/>
    </g>
  </svg>
  <div style="flex:1; min-width:190px; padding-top:8px;">
    <p id="jsStatus" style="font-size:11px; color:var(--text-muted); margin:0 0 10px;">Loading…</p>
    <div style="display:flex; gap:6px; margin-bottom:14px;" id="unitToggle">
      <button data-unit="deg" style="font-weight:600;">Degrees</button>
      <button data-unit="rad">Radians</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr auto; row-gap:12px; column-gap:14px; font-size:14px;">
      <span style="color:var(--text-secondary);">θ</span><span id="valTheta" style="font-weight:600; text-align:right;"></span>
      <span style="color:var(--text-secondary);"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ea580c;margin-right:6px;"></i>sin θ</span><span id="valSin" style="font-weight:600; text-align:right;"></span>
      <span style="color:var(--text-secondary);"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;margin-right:6px;"></i>cos θ</span><span id="valCos" style="font-weight:600; text-align:right;"></span>
      <span style="color:var(--text-secondary);"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:6px;"></i>tan θ</span><span id="valTan" style="font-weight:600; text-align:right;"></span>
      <span style="color:var(--text-secondary);">quadrant</span><span id="valQuad" style="font-weight:600; text-align:right;"></span>
    </div>
    <div style="margin-top:18px; display:flex; flex-wrap:wrap; gap:6px;" id="presets">
      <button data-deg="0" data-rad="0">0°</button>
      <button data-deg="30" data-rad="π/6">30°</button>
      <button data-deg="45" data-rad="π/4">45°</button>
      <button data-deg="60" data-rad="π/3">60°</button>
      <button data-deg="90" data-rad="π/2">90°</button>
      <button data-deg="135" data-rad="3π/4">135°</button>
      <button data-deg="180" data-rad="π">180°</button>
      <button data-deg="225" data-rad="5π/4">225°</button>
      <button data-deg="270" data-rad="3π/2">270°</button>
      <button data-deg="315" data-rad="7π/4">315°</button>
    </div>
    <p style="font-size:12px; color:var(--text-muted); margin-top:14px; line-height:1.5;">Drag the purple point around the circle for any angle, or drag the green point up and down the tangent line — both move the same angle.</p>
  </div>
</div>
<script src="unit-circle-interactive.js"></script>
</body>
</html>
